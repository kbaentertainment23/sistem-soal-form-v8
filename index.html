    <!-- Pencegahan error WebSocket Vite HMR & Warning Firestore di Preview Sandbox -->
    <script>
      (function () {
        // Filter benign Firestore unprovisioned database notice
        var originalWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function (a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : String(a));
          }).join(' ');
          if (
            text.indexOf('@firebase/firestore') !== -1 ||
            text.indexOf("Database '(default)' not found") !== -1 ||
            text.indexOf('Firestore cloud sync fallback') !== -1 ||
            text.indexOf('Could not sync') !== -1
          ) {
            return;
          }
          originalWarn.apply(console, args);
        };

        // Filter benign Vite client HMR websocket errors in sandbox environment
        var originalError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function (a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : String(a));
          }).join(' ');
          if (
            text.indexOf('[vite] failed to connect to websocket') !== -1 ||
            (text.indexOf('WebSocket') !== -1 && (text.indexOf('closed') !== -1 || text.indexOf('failed') !== -1))
          ) {
            return;
          }
          originalError.apply(console, args);
        };

        function isWsError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || err.reason || String(err));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1;
        }
        window.addEventListener('unhandledrejection', function (event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function (event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
